name: CI Break Before Prod

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, chore/ci-cd-break-before-prod]

jobs:
  lint:
    name: Lint (bash syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n em hooks e scripts
        run: |
          fails=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || fails=$((fails+1))
          done < <(find hooks scripts -name '*.sh' -print0)
          if [ "$fails" -gt 0 ]; then echo "::error::$fails script(s) com sintaxe invalida"; exit 1; fi
          echo "lint PASS"

  unit-test:
    name: Unit (manifest valido)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse manifest e reviewer JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('docs/foundry/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('reviewer/validation-rules.json','utf8'))"
          echo "unit PASS"

  eval-suite:
    name: Eval suite (3 camadas smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run eval break-before-prod
        run: node evals/break-before-prod/run.mjs

  iso-42001:
    name: ISO 42001 validators via tsx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install tsx e yaml
        run: npm install --no-save tsx yaml
      - name: Run ISO gate (clausulas 4.3, 5.2, 6.1, 8.1, 9.1)
        run: npx tsx scripts/governance/iso-42001-gate.ts

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep por segredos
        run: |
          if grep -rE "(gsk_[a-zA-Z0-9]{20,}|sk-[a-zA-Z0-9]{20,}|EAA[a-zA-Z0-9]{100,}|AKIA[0-9A-Z]{16})" --include='*.ts' --include='*.js' --include='*.mjs' --include='*.py' --include='*.json' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::segredo exposto detectado"; exit 1
          fi
          echo "secret-scan PASS"

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agf:ci .

  foundry-doctor:
    name: Foundry Doctor canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run foundry-doctor
        run: bash scripts/foundry-doctor.sh --canonical

  break-before-prod-gate:
    name: Break before prod gate
    runs-on: ubuntu-latest
    needs: [lint, unit-test, eval-suite, iso-42001, secret-scan, docker-build, foundry-doctor]
    if: always()
    steps:
      - name: Bloqueia merge e deploy se qualquer job vermelho
        run: |
          for r in "${{ needs.lint.result }}" "${{ needs.unit-test.result }}" "${{ needs.eval-suite.result }}" "${{ needs.iso-42001.result }}" "${{ needs.secret-scan.result }}" "${{ needs.docker-build.result }}" "${{ needs.foundry-doctor.result }}"; do
            if [ "$r" != "success" ]; then echo "::error::gate VERMELHO ($r) bloqueia merge e deploy"; exit 1; fi
          done
          echo "gate VERDE"
